<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Try icelens</title>
<meta name="description" content="icelens, the terminal browser for Apache Iceberg, running in your browser on a demo catalog.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%230a7ea4' d='M16 4 21.5 13h-11z'/%3E%3Cpath fill='%230a7ea4' opacity='.4' d='M8.5 18h15l-3 9.5h-9z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<!--#demo-head-->
</head>
<body class="try">
<!--#header try.html-->
<main class="wide demo">
  <div class="try-head">
    <div>
      <h1>Try icelens</h1>
      <p class="lede">The real icelens, running in this tab on a demo catalog: one table, five commits of
      history. Nothing is sent anywhere, and reloading starts the catalog afresh.</p>
    </div>
    <ul class="keys" aria-label="Keys">
      <li><kbd>1</kbd>&ndash;<kbd>9</kbd> <kbd>0</kbd> panes</li>
      <li><kbd>Enter</kbd> pin a snapshot</li>
      <li><kbd>g</kbd> guide</li>
      <li><kbd>?</kbd> all keys</li>
      <li><kbd>Esc</kbd><kbd>Esc</kbd> leave the terminal</li>
    </ul>
  </div>
  <!--#demo-->
</main>
<!--#footer-->
<!--#demo-scripts-->
</body>
</html>
