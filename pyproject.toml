[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "icelens"
version = "0.1.0"
description = "Learn Apache Iceberg, and inspect your production Iceberg tables, from the terminal: snapshots, manifests, files and rows, as of any commit."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "harkanwals" }]
keywords = ["iceberg", "apache-iceberg", "tui", "textual", "duckdb", "pyiceberg", "lakehouse"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  # Not "OS Independent": local catalogs and sandboxes do not work on Windows yet (docs/PLATFORMS.md).
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]

# Every floor here is tested: CI's `minimums` job installs exactly these lowest versions and runs
# the suite. They used to be guesses, and at the guessed floors the suite failed on its second
# test (PyIceberg 0.10's snapshots), and DuckDB 1.4 called a function NumPy 2 removed.
dependencies = [
  # Textual's widget API is stable within a major version; the ceiling is narrow on purpose.
  "textual>=8,<9",
  # Metadata for every catalog dialect (REST, Glue, Hive, SQL), and the scan fallback
  # used when DuckDB cannot attach. sql-sqlite is not optional: --sandbox builds its
  # own catalog in a SQLite file, so without it the sandbox cannot open at all.
  "pyiceberg[pyarrow,sql-sqlite]>=0.12,<0.13",
  # Scanning, the SQL pane and every sandbox write. 1.5.5 is the release the suite and the
  # v3 sandbox (deletion vectors, MERGE) were built against; the canary job tries newer ones.
  # The ceiling is load-bearing: DuckDB 2.0 dropped `.arrow()` on a relation, which every
  # sandbox CREATE uses, and pip, pipx and `uv tool install` ignore uv.lock. Lift it only
  # once the suite passes on 2.x.
  "duckdb>=1.5.5,<2",
  # PyIceberg 0.12's own floor.
  "pyarrow>=18",
]

[project.optional-dependencies]
# The hermetic catalog the tests run against ships with the sandbox now, above.
# hypothesis drives the property tests over the quoting, guarding and scrubbing functions;
# pytest-cov is how CI says which branches nothing has reached; pytest-timeout turns a hang into a failure.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.14",
    "pyright[nodejs]>=1.1.400",
    "pytest-timeout>=2.3",
]

[project.scripts]
icelens = "icelens.cli:main"

[project.urls]
Homepage = "https://harkanwals.github.io/icelens/"
Source = "https://github.com/harkanwals/icelens"
Issues = "https://github.com/harkanwals/icelens/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/icelens"]

# Only what building and testing from source needs. Without this list hatchling takes every
# file git does not ignore, so an untracked note or an agent's config folder would ship.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "LICENSE", "README.md", "pyproject.toml", "uv.lock"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
# No single test takes a minute; one that blocks (a --serve that never stops, a socket that never
# answers) fails at five rather than holding CI until the runner gives up.
timeout = 300
markers = [
  "duckdb_extensions: needs DuckDB's iceberg, httpfs and aws extensions; skipped when they will not load, failed instead under ICELENS_REQUIRE_DUCKDB_EXTENSIONS=1",
  "slow: takes more than a few seconds; deselect with -m 'not slow'",
  "packaging: builds and installs the distribution; runs only with ICELENS_TEST_PACKAGING=1",
]

[tool.coverage.run]
branch = true
source = ["icelens"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if __name__ == .__main__.:"]

[tool.pyright]
# The package and the setup script, in basic mode, with no errors allowed (CI's lint job). The
# tests are left out for now: most of what basic mode says about them is Textual's query API
# returning `Widget` and fixtures annotated with what they yield; none of it was a bug.
include = ["src", "scripts"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
# The tests import their helpers (live, polaris, offline, ...) as top-level modules, as pytest does.
extraPaths = ["tests"]
venvPath = "."
venv = ".venv"
