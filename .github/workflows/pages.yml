name: pages

# The website, rebuilt from main. The wheel the demo installs is checked under Pyodide before it
# is published, so a change that breaks the browser build never reaches try.html.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/pyodide/package-lock.json
      - run: uv sync --locked --extra dev
      - name: Build the site and check its wheel under Pyodide
        run: make test-browser
      # v4, not v3: v3 calls actions/upload-artifact by tag from inside, and the repository
      # requires every action, nested ones included, to be pinned to a commit. v4 leaves hidden
      # files out of the artifact; the only one is .nojekyll, which a workflow deploy never reads.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
